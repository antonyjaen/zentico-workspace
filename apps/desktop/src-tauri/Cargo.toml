[package]
name = "zentico-desktop"
version = "0.1.0"
description = "Zentico Workspace desktop app"
edition = "2021"
publish = false

[lib]
name = "zentico_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-window-state = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"

[target.'cfg(not(windows))'.dependencies]
notify-rust = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
